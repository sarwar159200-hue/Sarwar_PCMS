name: Build Sarwar PCMS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: |
          $proj = Get-ChildItem -Path . -Recurse -Filter "*.vbproj" | Select-Object -First 1
          nuget restore $proj.FullName
        shell: pwsh

      - name: Build (Release / x86)
        run: |
          $proj = Get-ChildItem -Path . -Recurse -Filter "*.vbproj" | Select-Object -First 1
          msbuild $proj.FullName /p:Configuration=Release /p:Platform=x86
        shell: pwsh

      - name: Clean intermediate files before second build
        run: |
          Get-ChildItem -Path . -Recurse -Directory -Filter "obj" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Restore NuGet packages (again, after clean)
        run: |
          $proj = Get-ChildItem -Path . -Recurse -Filter "*.vbproj" | Select-Object -First 1
          nuget restore $proj.FullName
        shell: pwsh

      - name: Build (Release / x64)
        run: |
          $proj = Get-ChildItem -Path . -Recurse -Filter "*.vbproj" | Select-Object -First 1
          msbuild $proj.FullName /p:Configuration=Release /p:Platform=x64 /t:Rebuild
        shell: pwsh

      - name: List all build outputs (debug)
        run: |
          Write-Host "All .xll files found:"
          Get-ChildItem -Path . -Recurse -Filter "*.xll" | ForEach-Object { Write-Host $_.FullName }
        shell: pwsh

      - name: Assemble ready-to-install package (both bitnesses)
        shell: pwsh
        run: |
          $out = "Sarwar_PCMS_Package"
          New-Item -ItemType Directory -Path "$out\DLL Files\x86" -Force | Out-Null
          New-Item -ItemType Directory -Path "$out\DLL Files\x64" -Force | Out-Null

          function Assemble-Bitness($xllPattern, $pathMustContain, $destFolder) {
            $binPath = Get-ChildItem -Path "." -Recurse -Filter $xllPattern |
              Where-Object { $_.FullName -like "*$pathMustContain*" -and $_.FullName -notlike "*\publish\*" } |
              Select-Object -First 1
            if (-not $binPath) {
              Write-Error "Could not find $xllPattern under a path containing '$pathMustContain' (excluding publish/packed variants)."
              exit 1
            }
            Copy-Item $binPath.FullName "$destFolder\Sarwar_PCMS.xll" -Force
            $binDir = $binPath.DirectoryName

            $dnaFile = Get-ChildItem -Path $binDir -Filter "*.dna" | Select-Object -First 1
            if (-not $dnaFile) {
              Write-Error "No .dna file found in $binDir"
              exit 1
            }
            Copy-Item $dnaFile.FullName "$destFolder\Sarwar_PCMS.dna" -Force

            Get-ChildItem -Path $binDir -Filter "*.dll" | Copy-Item -Destination "$destFolder\" -Force

            if (Test-Path "$binDir\runtimes") {
              Copy-Item "$binDir\runtimes" "$destFolder\runtimes" -Recurse -Force
            }
          }

          # 64-bit: file is named Sarwar_PCMS64.xll (unpacked, in bin\x64\...)
          Assemble-Bitness "Sarwar_PCMS64.xll" "\x64\" "$out\DLL Files\x64"
          # 32-bit: file is named Sarwar_PCMS.xll (unpacked, in bin\x86\...)
          Assemble-Bitness "Sarwar_PCMS.xll" "\x86\" "$out\DLL Files\x86"

          Copy-Item "Install.bat" "$out\" -Force
          Copy-Item "Uninstall.bat" "$out\" -Force
          Copy-Item "README.md" "$out\" -Force -ErrorAction SilentlyContinue

      - name: Upload ready-to-install package
        uses: actions/upload-artifact@v4
        with:
          name: Sarwar_PCMS_Ready_To_Install
          path: Sarwar_PCMS_Package/
